services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog_library_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: the_catalog_library
      DB_USER: library_user
      DB_PASS: library_secure_pass_2026
      APP_ENV: development
      APP_DEBUG: "true"
      MAIL_ENABLED: "false"
      SESSION_DRIVER: file
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/var/www/html/uploads

  db:
    image: mysql:8.0
    container_name: catalog_library_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_pass_2026
      MYSQL_DATABASE: the_catalog_library
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_secure_pass_2026
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/library_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/demo_data.sql:/docker-entrypoint-initdb.d/02_demo.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "library_user", "-plibrary_secure_pass_2026"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:

